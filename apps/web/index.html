<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Two media-scoped tags cover the OS preference before any script runs; the third is the one
      ThemeProvider rewrites when an explicit choice overrides the OS. Order matters: the unscoped
      tag must come last so it wins once it is set.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e2ded5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
    <meta name="theme-color" content="#1c1c1e" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      /*
       * Stamp the theme before the first paint.
       *
       * Without this the document paints once at the OS preference and then corrects itself when
       * React mounts — a white flash on every load for anyone who chose dark on a light machine.
       *
       * Mirrors ThemeProvider deliberately, because it cannot import from it. The storage key and
       * the default are duplicated from `src/context/useTheme.ts`; if either changes there, this
       * has to change with it. `system` removes the attribute rather than stamping a value, which
       * is the same contract theme.css is written against.
       */
      (function () {
        try {
          var stored = window.localStorage.getItem('mailmind_theme');
          var choice =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
          if (choice === 'system') document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', choice);
          var resolved =
            choice === 'dark' ||
            (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? '#1c1c1e'
              : '#e2ded5';
          var themeColor = document.querySelector('meta[name="theme-color"]:not([media])');
          if (themeColor) themeColor.setAttribute('content', resolved);
        } catch (error) {
          /* Storage can throw outright in a private window. Dark is the default either way. */
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Manrope is the non-Apple fallback for the system UI stack, DM Mono carries codes and
      timestamps, and Fraunces is now the wordmark alone — so it is loaded at one weight.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AMO: Automated Mail Organizer</title>
    <meta
      name="description"
      content="AMO sorts your Gmail into folders automatically, using only each email's sender, subject and date. Read-only, and it never stores the body of an email."
    />
    <!--
      The opening animation. Styled here rather than in the bundle so it paints with the HTML,
      before the app's CSS has arrived; see /intro.js for when it plays.
    -->
    <style>
      .amo-intro {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #000;
        transition: opacity 450ms ease;
      }
      .amo-intro[hidden] {
        display: none;
      }
      .amo-intro video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* A wide clip on an upright phone is shown whole rather than cropped to its middle. */
      @media (orientation: portrait) {
        .amo-intro video {
          object-fit: contain;
        }
      }
      .amo-intro--leaving {
        opacity: 0;
        pointer-events: none;
      }
      .amo-intro__skip {
        position: absolute;
        right: 1.25rem;
        bottom: 1.25rem;
        padding: 0.5rem 0.85rem;
        font:
          500 0.8125rem/1 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #f5f5f7;
        background: rgb(0 0 0 / 0.45);
        border: 1px solid rgb(255 255 255 / 0.28);
        border-radius: 999px;
        cursor: pointer;
      }
      .amo-intro__skip:hover {
        background: rgb(0 0 0 / 0.7);
      }
      html.amo-intro-playing body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="amo-intro"
      class="amo-intro"
      hidden
      aria-hidden="true"
      data-src-large="/intro/amo-intro-v1-1080.mp4"
      data-src-small="/intro/amo-intro-v1-720.mp4"
    >
      <video
        muted
        playsinline
        preload="auto"
        poster="/intro/amo-intro-v1-poster.jpg"
        disablepictureinpicture
      ></video>
      <button class="amo-intro__skip" type="button">Skip intro</button>
    </div>
    <script src="/intro.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
