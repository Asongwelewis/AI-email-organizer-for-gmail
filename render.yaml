services:
  - type: web
    name: ai-email-organizer-for-gmail
    runtime: node
    # `--include=dev` is load-bearing. Every tool this build runs — typescript, tsc-alias, prisma,
    # tsx, cross-env, @sentry/cli — is a devDependency, and npm omits those whenever NODE_ENV is
    # production. Without the flag, setting NODE_ENV below silently installs none of them and the
    # build dies before it compiles a line.
    #
    # `npm run build:api` rather than `npm exec ... --workspace @mailmind/api`: npm exec parses
    # that flag as its own wherever it appears, and runs the whole command from apps/api, where the
    # root-relative release script does not exist. It is the same bug that failed every Vercel
    # deployment for twenty attempts.
    buildCommand: >-
      npm ci --include=dev &&
      npm run prisma:generate --workspace @mailmind/api &&
      npm run build:api
    # Kept because it is the right hook — it runs after a successful build and before traffic
    # switches — but it is not the guarantee. On 28 Aug 2026 the feedback migration reached main,
    # the code deployed, and the migration did not run: every valid POST /api/feedback answered
    # 500 against a table that did not exist. The command itself is fine (verified by hand), so
    # either this service is not synced to this blueprint — it still answers on
    # api.mailmindai.tech while the URLs below say .onrender.com — or its plan does not offer
    # pre-deploy commands, which Render gates behind paid instance types.
    preDeployCommand: npm exec --workspace @mailmind/api -- prisma migrate deploy
    # So the start path runs it too. `migrate deploy` is idempotent and takes an advisory lock, so
    # doing it in both places costs one fast query on a no-op and makes it impossible for the API
    # to come up against a schema its code does not match.
    startCommand: >-
      npm exec --workspace @mailmind/api -- prisma migrate deploy &&
      npm run start --workspace @mailmind/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: WEB_APP_URL
        value: https://mailmindai.tech
      - key: API_BASE_URL
        value: https://ai-email-organizer-for-gmail.onrender.com
      - key: GOOGLE_LOGIN_REDIRECT_URI
        value: https://ai-email-organizer-for-gmail.onrender.com/api/auth/google/callback
      - key: GOOGLE_GMAIL_REDIRECT_URI
        value: https://ai-email-organizer-for-gmail.onrender.com/api/integrations/google/callback
      - key: COOKIE_SECURE
        value: 'true'
      # Required: the SPA is on Vercel and the API is on Render, so the session
      # cookie is cross-site. Anything but 'none' is never sent by the browser
      # and login fails silently. Startup validation enforces this.
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: SENTRY_REQUIRE_CONFIG
        value: 'true'
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY_VERSION
        sync: false
      - key: GEMINI_API_KEY
        sync: false
