name: Wake API

# The API runs on Render's free plan, which puts the process to sleep after 15 minutes without an
# inbound request. Asleep, nothing runs: the watcher cannot sort new mail, the full runs do not
# start, and Supabase pauses a free project after about a week without database activity. On boot
# the API treats an unreachable database as fatal, so a paused project once became a month-long
# crash loop (September 2026) — see the startup check in apps/api/src/server.ts.
#
# The API now keeps itself awake by requesting its own public /health every ten minutes (see
# apps/api/src/services/keepAwake.ts). That cannot wake a process that is already asleep — after a
# Render restart, a crash, or any gap — so this runs around the clock as the backstop that does.
# GitHub can delay scheduled runs by many minutes under load, which is why it is the backstop and
# not the mechanism, and why it runs off the top of the hour.
#
# Around the clock costs about 744 of the 750 free instance hours a Render workspace shares each
# month. That is only safe while this API is the workspace's only free web service; with another
# one, the hours run out near month end and Render suspends them all until the 1st.
#
# `/ready` rather than `/health`: it reads the database, so every ping is database activity too, and
# it answers 503 when a migration this build ships has not reached the database — so a missing
# migration turns this workflow red within ten minutes instead of surfacing as 500s in the app.
#
# GitHub disables scheduled workflows in a repository with no activity for 60 days. If commits
# stop for that long, re-enable this in the Actions tab.

on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: wake-api
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Set a repository variable to point this elsewhere, e.g. the custom API domain.
      API_URL: ${{ vars.MAILMIND_API_URL || 'https://ai-email-organizer-for-gmail.onrender.com' }}
    steps:
      - name: Wake the API and check its database
        shell: bash
        run: |
          # A cold start takes 30-60 s before the process answers, and Render may drop the first
          # connection while it boots, so retry rather than fail on the first attempt.
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --output response.json --write-out '%{http_code}' \
              --max-time 90 "$API_URL/ready" || true)
            if [ "$status" = "200" ]; then
              cat response.json; echo
              exit 0
            fi
            echo "attempt $attempt: /ready answered ${status:-no response}"
            sleep 20
          done
          # 503 means the API is up and the database is not: the failure this workflow exists to
          # prevent. Fail loudly so the run shows red rather than waiting for a user to notice.
          cat response.json 2>/dev/null || true
          exit 1
